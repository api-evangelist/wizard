name: Wizard
description: 'Wizard is an AI-powered personal shopping agent for consumers. Shoppers
  describe what they want in natural language and Wizard searches across retailer websites,
  customer reviews, trusted editorial, and social content to return a tightly curated
  set of product recommendations, with direct checkout from retailers such as Amazon,
  Best Buy, Apple, and Target. The company is backed by Accel. As of this enrichment
  pass Wizard is a consumer-facing web/app product and exposes no public developer
  API, SDK, documentation, or well-known discovery surface (developer/docs/api subdomains
  and /.well-known/security.txt all return 404).'
